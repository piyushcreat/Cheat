<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Data Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Animated Background Particles */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            filter: blur(80px);
            opacity: 0.3;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        /* Glassmorphism Container */
        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), transparent, var(--secondary));
            z-index: -1;
            border-radius: 22px;
            opacity: 0.5;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--primary);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Orbitron', sans-serif;
        }

        .counter-box span {
            font-size: 1.5rem;
            color: var(--primary);
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 30px var(--primary);
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .success { color: #00ff88; text-shadow: 0 0 5px #00ff88; }
        .error { color: #ff3366; text-shadow: 0 0 5px #ff3366; }

        /* Floating particles effect */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="bg-animation" id="bg">
        <div class="circle" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
        <div class="circle" style="width: 400px; height: 400px; bottom: 10%; right: 10%; animation-delay: -5s;"></div>
    </div>

    <div class="container">
        <div class="counter-box">
            SYSTEM DATA LOGS
            <span id="totalCount">SYNCING...</span>
        </div>
        
        <h2>User Interface</h2>

        <form id="futuristic-form">
            <div class="form-group">
                <label>Identify Name</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Physical Age</label>
                <input type="number" id="age" name="age" placeholder="Enter age" required>
            </div>
            <div class="form-group">
                <label>Encryption Message</label>
                <textarea id="message" name="message" placeholder="Type your message..." required></textarea>
            </div>
            <button type="submit" id="submitBtn">Initialize Upload</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2HQlhTg3fB3gjTi9akqjbVCUTamk6J-0nYt2WmFT3yOeqg4m6MBUlUzVMnnAQ5NUlfQ/exec';

        const form = document.getElementById('futuristic-form');
        const statusDiv = document.getElementById('status');
        const countDiv = document.getElementById('totalCount');

        // Initial background particle generation
        function createParticles() {
            const bg = document.getElementById('bg');
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                let size = Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animation = `move ${Math.random() * 20 + 10}s linear infinite`;
                bg.appendChild(p);
            }
        }
        createParticles();

        async function updateCount() {
            if (SCRIPT_URL.includes('YOUR_GOOGLE')) return;
            try {
                const res = await fetch(SCRIPT_URL + "?action=getCount");
                const data = await res.json();
                countDiv.innerText = data.count.toString().padStart(4, '0');
            } catch (e) { 
                countDiv.innerText = "OFFLINE";
            }
        }

        updateCount();
        setInterval(updateCount, 30000); // Auto-sync every 30 seconds

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL.includes('YOUR_GOOGLE')) {
                alert('Please update the SCRIPT_URL in the JavaScript code!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "UPLOADING...";
            btn.disabled = true;
            statusDiv.className = '';
            statusDiv.innerText = "CONNECTING TO SERVER...";

            const formData = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    statusDiv.className = 'success';
                    statusDiv.innerText = "DATA UPLOAD SUCCESSFUL";
                    form.reset();
                    updateCount();
                } else {
                    throw new Error();
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerText = "UPLOAD FAILED: SERVER DISCONNECT";
            } finally {
                btn.innerText = "INITIALIZE UPLOAD";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
