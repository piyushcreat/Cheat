<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baddie Dilado 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --baddie-pink: #ff007f;
            --baddie-cyan: #00f2ff;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            background: radial-gradient(circle at center, #1a0b1a 0%, #000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Floating Background Decoration */
        .glow {
            position: absolute; width: 300px; height: 300px;
            background: var(--baddie-pink); filter: blur(120px);
            opacity: 0.2; border-radius: 50%; z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }

        /* Main Container */
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Header */
        .chat-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--baddie-pink);
            text-shadow: 0 0 10px var(--baddie-pink);
            letter-spacing: 1px;
        }

        .counter-badge {
            background: rgba(255, 0, 127, 0.2);
            color: var(--baddie-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 5px;
            display: inline-block;
        }

        /* Form Area */
        .chat-body {
            padding: 25px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-bubble {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px 20px 20px 5px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-group { margin-bottom: 15px; }

        input, textarea {
            width: 100%;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--baddie-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .send-btn {
            background: var(--baddie-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .send-btn:hover {
            background: #ff3399;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        /* Status & Hidden elements */
        #status { text-align: center; margin-top: 10px; font-size: 0.8rem; }
        .hidden { display: none !important; }
        
        .footer-link {
            text-align: center;
            padding: 15px;
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .footer-link a { color: var(--baddie-cyan); text-decoration: none; }

    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🎀 Baddie Dilado</h1>
            <div class="counter-badge" id="logsCount">SYNCING...</div>
        </div>

        <div class="chat-body">
            <!-- Chat Bubble Text -->
            <div class="chat-bubble" id="chatText">
                Hey! Identity verify karo pehle... Name aur Age batao ✨
            </div>

            <form id="mainForm">
                <!-- Registration Fields (Hide after 1st time) -->
                <div id="reg-fields">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="age" placeholder="Your Age" required>
                    </div>
                </div>

                <!-- Message Box (Always Show) -->
                <div class="form-group">
                    <textarea id="message" rows="3" placeholder="Write a message..." required></textarea>
                </div>

                <button type="submit" class="send-btn" id="sendBtn">SEND MESSAGE 🚀</button>
            </form>
            
            <div id="status"></div>
        </div>

        <div class="footer-link">
            <a href="dashboard.html">VIEW SYSTEM LOGS</a>
        </div>
    </div>

    <script>
        // APNA GOOGLE SCRIPT URL YAHA DALEIN
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2HQlhTg3fB3gjTi9akqjbVCUTamk6J-0nYt2WmFT3yOeqg4m6MBUlUzVMnnAQ5NUlfQ/exec';

        const form = document.getElementById('mainForm');
        const regFields = document.getElementById('reg-fields');
        const chatText = document.getElementById('chatText');
        const logsCount = document.getElementById('logsCount');
        const statusDiv = document.getElementById('status');

        // Check if user is already locked in
        const savedName = localStorage.getItem('baddie_name');
        const savedAge = localStorage.getItem('baddie_age');

        if (savedName) {
            regFields.classList.add('hidden');
            document.getElementById('name').required = false;
            document.getElementById('age').required = false;
            chatText.innerHTML = `Welcome back, <b>${savedName}</b>! 🎀<br>Kya chal raha hai? Kuch naya message bhejo!`;
        }

        // Fetch Total Logs Count
        async function updateCount() {
            if (SCRIPT_URL.includes('YOUR_GOOGLE')) return;
            try {
                const res = await fetch(SCRIPT_URL + "?action=getCount");
                const data = await res.json();
                logsCount.innerText = `${data.count} PEOPLE LOGGED`;
            } catch (e) { logsCount.innerText = "ONLINE"; }
        }
        updateCount();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = "SENDING...";

            const finalName = savedName || document.getElementById('name').value;
            const finalAge = savedAge || document.getElementById('age').value;
            const finalMessage = document.getElementById('message').value;

            const payload = {
                name: finalName,
                age: finalAge,
                message: finalMessage
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // Lock user if first time
                    if (!savedName) {
                        localStorage.setItem('baddie_name', finalName);
                        localStorage.setItem('baddie_age', finalAge);
                    }

                    statusDiv.innerHTML = "<span style='color:#00ff88'>✔ Delivered</span>";
                    document.getElementById('message').value = '';
                    
                    // Thodi der baad refresh taaki UI update ho jaye
                    setTimeout(() => location.reload(), 1500);
                }
            } catch (error) {
                statusDiv.innerHTML = "<span style='color:#ff3366'>✖ Connection Error</span>";
                btn.disabled = false;
                btn.innerText = "SEND MESSAGE 🚀";
            }
        });
    </script>
</body>
</html>
