<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baddie Dilado 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 25px; }
        
        #welcome-msg {
            margin-bottom: 20px;
            color: #00ff88;
            font-weight: bold;
            display: none; /* Default hidden */
        }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--primary); font-size: 0.8rem; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { background: var(--primary); color: black; box-shadow: 0 0 20px var(--primary); }

        #status { margin-top: 15px; font-size: 0.8rem; }
        
        /* Hide class */
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">User Access</h2>
    
    <div id="welcome-msg">Welcome back, <span id="display-name"></span>!</div>

    <form id="data-form">
        <!-- Name aur Age sirf pehli baar dikhenge -->
        <div id="user-info-fields">
            <div class="form-group">
                <label>IDENTITY NAME</label>
                <input type="text" id="name" placeholder="Enter Name" required>
            </div>
            <div class="form-group">
                <label>AGE SECTOR</label>
                <input type="number" id="age" placeholder="Enter Age" required>
            </div>
        </div>

        <!-- Message hamesha dikhega -->
        <div class="form-group">
            <label>ENCRYPTED MESSAGE</label>
            <textarea id="message" rows="3" placeholder="Type your message..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">SEND DATA</button>
    </form>
    
    <div id="status"></div>
    <br>
    <a href="dashboard.html" style="color: #666; text-decoration: none; font-size: 0.7rem;">VIEW LOGS</a>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2HQlhTg3fB3gjTi9akqjbVCUTamk6J-0nYt2WmFT3yOeqg4m6MBUlUzVMnnAQ5NUlfQ/exec';

    const form = document.getElementById('data-form');
    const userInfoFields = document.getElementById('user-info-fields');
    const welcomeMsg = document.getElementById('welcome-msg');
    const displayName = document.getElementById('display-name');
    const statusDiv = document.getElementById('status');

    // 1. Check if user is already registered in this browser
    const savedName = localStorage.getItem('user_name');
    const savedAge = localStorage.getItem('user_age');

    if (savedName && savedAge) {
        // Agar pehle se registered hai, to fields hide karo
        userInfoFields.classList.add('hidden');
        welcomeMsg.style.display = 'block';
        displayName.innerText = savedName;
        
        // Form inputs ko required se hata do kyunki wo hidden hain
        document.getElementById('name').required = false;
        document.getElementById('age').required = false;
        
        document.getElementById('title').innerText = "New Message";
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        statusDiv.innerText = "Transmitting...";

        // Agar saved data hai to wo use karo, warna input se lo
        const finalName = savedName || document.getElementById('name').value;
        const finalAge = savedAge || document.getElementById('age').value;
        const finalMessage = document.getElementById('message').value;

        const data = {
            name: finalName,
            age: finalAge,
            message: finalMessage
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.status === 'success') {
                // 2. Pehli baar submit karne par LocalStorage mein save karo
                if (!savedName) {
                    localStorage.setItem('user_name', finalName);
                    localStorage.setItem('user_age', finalAge);
                }

                statusDiv.style.color = "#00ff88";
                statusDiv.innerText = "SUCCESS: DATA LOGGED";
                
                // Form reset karo sirf message box
                document.getElementById('message').value = '';
                
                // Page refresh tak user ko register manlo
                location.reload(); 
            }
        } catch (error) {
            statusDiv.style.color = "#ff3366";
            statusDiv.innerText = "ERROR: UPLOAD FAILED";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
